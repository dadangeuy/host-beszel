services:
  beszel-agent:
    image: henrygd/beszel-agent:alpine
    env_file:
      # environment
      - environment/beszel-agent.env
      - path: environment/beszel-agent.${STAGE}.env
        required: false
      - path: environment/beszel-agent.${STAGE}.${MACHINE_ID}.env
        required: false
      # secret
      - ./storage/secret/beszel-agent.env
      - path: ./storage/secret/beszel-agent.${STAGE}.env
        required: false
      - path: ./storage/secret/beszel-agent.${STAGE}.${MACHINE_ID}.env
        required: false
    network_mode: container:tailscale
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./storage/beszel-agent/data:/var/lib/beszel-agent
      - ./storage/beszel-agent/socket:/beszel_socket