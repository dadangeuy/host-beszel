# reference: https://beszel.dev/guide/getting-started
name: beszel
services:
  tailscale:
    profiles:
      - mele-quieter-4c
      - raspberry-pi-5
      - razer-blade-14
    image: docker.io/tailscale/tailscale:stable
    restart: unless-stopped
    env_file: ./environment/${HOSTNAME}/tailscale.env
    volumes:
      - ./storage/tailscale/ts-authkey-test:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    healthcheck:
      test: tailscale status --active || exit 1
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 4
  nginx:
    profiles:
      - raspberry-pi-5
    image: docker.io/nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./configuration/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./file/nginx/internal.crt:/etc/ssl/certs/internal.crt
      - ./file/nginx/internal.key:/etc/ssl/private/internal.key
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
      hub:
        condition: service_healthy
    healthcheck:
      test: curl --fail -I --insecure https://127.0.0.1:443/ || exit 1
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 4
  hub:
    profiles:
      - raspberry-pi-5
    image: henrygd/beszel:alpine
    restart: unless-stopped
    network_mode: service:tailscale
    volumes:
      - ./storage/hub/data:/beszel_data
      - ./storage/hub/socket:/beszel_socket
    healthcheck:
      test: wget -q --spider http://127.0.0.1:8090/ || exit 1
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 4
    depends_on:
      tailscale:
        condition: service_healthy
  agent:
    profiles:
      - raspberry-pi-5
      - mele-quieter-4c
      - razer-blade-14
    image: henrygd/beszel-agent:alpine
    restart: unless-stopped
    network_mode: service:tailscale
    volumes:
      - ./storage/agent/data:/var/lib/beszel-agent
      - ./storage/agent/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file: ./environment/${HOSTNAME}/agent.env
    depends_on:
      tailscale:
        condition: service_healthy
