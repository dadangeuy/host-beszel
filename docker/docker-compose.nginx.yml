services:
  nginx:
    image: docker.io/nginx:stable-alpine
    volumes:
      - ./file/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./file/nginx/internal.crt:/etc/ssl/certs/internal.crt:ro
      - ./file/nginx/internal.key:/etc/ssl/private/internal.key:ro
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
      hub:
        condition: service_healthy
    healthcheck:
      test: 'curl --fail -I --insecure https://127.0.0.1:443'