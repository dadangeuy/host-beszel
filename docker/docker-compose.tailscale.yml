services:
  tailscale:
    profiles:
      - mele-quieter-4c
      - raspberry-pi-5
      - razer-blade-14
    image: docker.io/tailscale/tailscale:stable
    env_file:
      - ./environment/tailscale.env
      - ./environment/${HOSTNAME}/tailscale.env
    volumes:
      - ./storage/tailscale/ts-authkey-test:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    healthcheck:
      test: 'tailscale status --active'