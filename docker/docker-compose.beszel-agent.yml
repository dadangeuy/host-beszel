services:
  beszel-agent:
    profiles:
      - hub
      - agent
    image: henrygd/beszel-agent:alpine
    env_file:
      - environment/beszel-agent.env
      - environment/${STAGE}/beszel-agent.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./storage/beszel-agent/data:/var/lib/beszel-agent
      - ./storage/beszel-agent/socket:/beszel_socket