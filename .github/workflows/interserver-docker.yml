name: InterServer (Docker)
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy docker update
    environment: interserver
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: '${{ secrets.TS_OAUTH_CLIENT_ID }}'
          audience: '${{ secrets.TS_AUDIENCE }}'
          tags: 'tag:github'
      - name: Update proxmox-bs-2
        env:
          SSHPASS: '${{ secrets.SSH_PASSWORD }}'
        run: sshpass -e ssh -o StrictHostKeyChecking=accept-new root@proxmox-bs-2 "bash -lc 'cd /docker/services/${{ github.event.repository.name }}/docker && make update'"
permissions:
  id-token: write
