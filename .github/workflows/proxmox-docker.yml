name: Proxmox (Docker)
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy docker update
    environment: proxmox
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: '${{ secrets.TS_OAUTH_CLIENT_ID }}'
          audience: '${{ secrets.TS_AUDIENCE }}'
          tags: 'tag:github'
      - name: Update beszel
        env:
          SSHPASS: '${{ secrets.SSH_PASSWORD }}'
        run: sshpass -e ssh -o StrictHostKeyChecking=accept-new user@beszel "bash -lc 'cd /docker/services/${{ github.event.repository.name }}/docker && make update'"
      - name: Update adguard-1
        env:
          SSHPASS: '${{ secrets.SSH_PASSWORD }}'
        run: sshpass -e ssh -o StrictHostKeyChecking=accept-new user@adguard-1 "bash -lc 'cd /docker/services/${{ github.event.repository.name }}/docker && make update'"
      - name: Update nginx-1
        env:
          SSHPASS: '${{ secrets.SSH_PASSWORD }}'
        run: sshpass -e ssh -o StrictHostKeyChecking=accept-new user@nginx-1 "bash -lc 'cd /docker/services/${{ github.event.repository.name }}/docker && make update'"
      - name: Update cloudflare-1
        env:
          SSHPASS: '${{ secrets.SSH_PASSWORD }}'
        run: sshpass -e ssh -o StrictHostKeyChecking=accept-new user@cloudflare-1 "bash -lc 'cd /docker/services/${{ github.event.repository.name }}/docker && make update'"
      - name: Update samba-1
